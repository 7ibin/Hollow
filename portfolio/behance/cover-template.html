<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Hollow Behance Cover</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 2800px;
      height: 2190px;
      overflow: hidden;
      font-family: 'DM Sans', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #cover {
      width: 2800px;
      height: 2190px;
      display: flex;
      align-items: center;
      background:
        radial-gradient(ellipse 90% 70% at 92% 18%, rgba(13, 79, 139, 0.07) 0%, transparent 55%),
        radial-gradient(ellipse 70% 60% at 8% 92%, rgba(99, 102, 241, 0.06) 0%, transparent 50%),
        linear-gradient(168deg, #fafbfc 0%, #f4f6f9 42%, #eef2f7 100%);
    }
    .brand {
      flex: 0 0 1020px;
      padding: 0 80px 0 140px;
    }
    .brand__kicker {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 40px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #64748b;
    }
    .brand__kicker::before {
      content: '';
      width: 56px;
      height: 3px;
      background: linear-gradient(90deg, #0d4f8b, #5eb8ff);
      border-radius: 2px;
    }
    .brand__title {
      font-size: 168px;
      font-weight: 800;
      letter-spacing: -0.055em;
      line-height: 0.9;
      color: #062d52;
      margin-bottom: 32px;
    }
    .brand__desc {
      font-size: 38px;
      font-weight: 600;
      line-height: 1.45;
      color: #334155;
      max-width: 820px;
      margin-bottom: 48px;
    }
    .brand__tags {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }
    .brand__tags span {
      font-size: 22px;
      font-weight: 700;
      padding: 14px 26px;
      border-radius: 999px;
      color: #0d4f8b;
      background: #fff;
      border: 1px solid #e2e8f0;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    .brand__meta {
      margin-top: 56px;
      font-size: 24px;
      font-weight: 500;
      color: #94a3b8;
    }
    .showcase {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 64px;
      padding: 0 80px 0 20px;
    }
    .screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .screen__label {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #94a3b8;
    }
    /*
      Screenshots are full-page (2×). Clip both to the same source height
      that lands in empty padding: after Home’s product cards, after Compare’s
      Buy row — so buttons are not cut in half.
    */
    .screen__device {
      --shot-w: 780;
      --crop-h: 1864;
      width: 430px;
      height: calc(430px * var(--crop-h) / var(--shot-w));
      border-radius: 40px;
      overflow: hidden;
      background: #f4f7fb;
      border: 1px solid rgba(15, 23, 42, 0.08);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.8) inset,
        0 1px 2px rgba(15, 23, 42, 0.04),
        0 8px 24px rgba(15, 23, 42, 0.06),
        0 32px 64px -8px rgba(13, 79, 139, 0.14),
        0 48px 96px -24px rgba(15, 23, 42, 0.12);
    }
    .screen__device img {
      display: block;
      width: 430px;
      height: auto;
    }
  </style>
</head>
<body>
  <div id="cover">
    <div class="brand">
      <p class="brand__kicker">UI / UX Case Study</p>
      <h1 class="brand__title">Hollow</h1>
      <p class="brand__desc">Mobile insurance for India — quote, compare plans, checkout &amp; post-purchase care</p>
      <div class="brand__tags">
        <span>Health</span>
        <span>Motor</span>
        <span>Term</span>
        <span>Home</span>
      </div>
      <p class="brand__meta">390px prototype · Design system · End-to-end flows</p>
    </div>
    <div class="showcase">
      <figure class="screen">
        <figcaption class="screen__label">Home</figcaption>
        <div class="screen__device">
          <img src="screens/02-home.png" alt="" width="390" height="844" />
        </div>
      </figure>
      <figure class="screen">
        <figcaption class="screen__label">Compare</figcaption>
        <div class="screen__device">
          <img src="screens/06-compare-table-health.png" alt="" width="390" height="844" />
        </div>
      </figure>
    </div>
  </div>
</body>
</html>
